<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Илья Гончаров</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #241f1a; cursor: none; touch-action: none; }
    body {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: #f3ecdf;
      overflow: hidden;
    }
    #view { display: block; width: 100%; height: 100%; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .label {
      position: absolute;
      left: 0;
      top: 0;
      width: 340px;
      max-height: min(78vh, 540px);
      overflow: auto;
      padding: 8px 10px 10px;
      background: rgba(28, 24, 20, 0.92);
      border: 1px solid rgba(243, 236, 223, 0.22);
      border-radius: 4px;
      pointer-events: auto;
      touch-action: pan-y;
      transform: translate(-50%, calc(-100% - 16px));
    }
    .label b { display: block; font-weight: 500; font-size: 13px; }
    .label .role { display: block; margin-top: 2px; color: #cbbfae; font-size: 11px; font-style: normal; }
    .label .role[hidden] { display: none; }
    .label .who { display: block; margin-top: 8px; color: rgba(243, 236, 223, 0.45); font-size: 10px; letter-spacing: 0.04em; }
    .label p { margin: 2px 0 0; color: #cbbfae; font-size: 12px; line-height: 1.4; }
    .label section[hidden] { display: none; }
    .label a { color: #f3ecdf; cursor: pointer; }
    .label a[hidden] { display: none; }
    .caret {
      display: inline-block;
      width: 0.5em;
      height: 0.95em;
      margin-left: 1px;
      background: #cbbfae;
      vertical-align: text-bottom;
    }
    .caret[hidden] { display: none; }
    #name {
      position: fixed;
      top: 16px;
      left: 18px;
      margin: 0;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.5);
      pointer-events: none;
    }
    #hint {
      position: fixed;
      left: 18px;
      bottom: 16px;
      max-width: min(560px, calc(100vw - 36px));
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.5);
      pointer-events: none;
    }
    #hint p { margin: 0; }
    #hint .lead-row {
      pointer-events: auto;
      display: flex;
      align-items: baseline;
    }
    #lang {
      display: flex;
      align-items: baseline;
      flex-shrink: 0;
      gap: 10px;
      margin-left: 14px;
    }
    #lang button,
    #rhythm button {
      cursor: none;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.34);
      text-align: left;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
    }
    #lang button[aria-pressed="true"],
    #rhythm button[aria-pressed="true"] { color: rgba(243, 236, 223, 0.82); }
    #sound {
      pointer-events: auto;
      cursor: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.82);
      text-align: left;
      -webkit-appearance: none;
      appearance: none;
    }
    #sound[aria-pressed="false"] { color: rgba(243, 236, 223, 0.28); }
    #hint .key {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 12px;
      row-gap: 3px;
      margin-top: 3px;
    }
    #hint .key-item { white-space: nowrap; }
    #hint i {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 5px 1px 0;
      border-radius: 50%;
      vertical-align: middle;
    }
    #hint .lead-row { z-index: 30; }
    #rhythm {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 20;
      pointer-events: auto;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 10px;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.5);
      text-align: right;
    }
    #rhythm p { margin: 0; }
    #rhythm > div {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0;
    }
    #sound + div { margin-left: 14px; }
    @media (min-width: 721px) {
      #hint .lead-row {
        position: fixed;
        top: 16px;
        right: 18px;
        left: auto;
        bottom: auto;
        max-width: min(420px, calc(100vw - 36px));
        justify-content: flex-end;
      }
      #hint .lead {
        margin: 0;
        text-align: right;
      }
    }
    @media (max-width: 720px) {
      #hint .lead { display: none; }
      #hint {
        left: 18px;
        right: auto;
        bottom: calc(8px + env(safe-area-inset-bottom));
        max-width: calc(100vw - 36px);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
      }
      #hint .lead-row {
        position: static;
        justify-content: flex-start;
        width: auto;
        order: 1;
        margin: 0;
      }
      #lang { margin: 0; gap: 10px; }
      #hint .key {
        margin: 0;
        order: 3;
      }
      #rhythm {
        position: static;
        order: 2;
        width: max-content;
        max-width: calc(100vw - 36px);
        justify-content: flex-start;
        align-items: baseline;
        gap: 10px;
        text-align: left;
        padding: 0;
        margin: 0;
      }
      #rhythm > div { gap: 10px; }
      #sound,
      #sound + div { margin: 0; }
      #sound,
      #lang button,
      #rhythm button {
        position: relative;
        width: auto;
        height: auto;
        margin: 0;
        padding: 0;
        min-width: 0;
        min-height: 0;
        line-height: 1.55;
      }
      /* зона тапа шире строки, на вёрстку не влияет */
      #sound::after,
      #lang button::after,
      #rhythm button::after {
        content: "";
        position: absolute;
        left: -4px;
        right: -4px;
        top: -12px;
        bottom: -12px;
      }
    }
  </style>
</head>
<body>
  <p id="name">elia goncharov</p>
  <canvas id="view"></canvas>
  <div id="labels"></div>
  <aside id="hint">
    <div class="lead-row">
      <p class="lead">наведите курсор на куб, чтобы открыть карточку</p>
      <div id="lang">
        <button type="button" data-lang="ru" aria-pressed="true">ru</button>
        <button type="button" data-lang="en" aria-pressed="false">en</button>
      </div>
    </div>
    <aside id="rhythm">
      <button id="sound" type="button" aria-pressed="false">звук вкл</button>
      <div>
        <button type="button" data-rhythm="pulse">удар</button>
        <button type="button" data-rhythm="torn">рваный</button>
        <button type="button" data-rhythm="drops">ноты</button>
      </div>
    </aside>
    <p class="key"><span class="key-item"><i data-kind="dev"></i>разработка</span><span class="key-item"><i data-kind="art"></i>арт</span><span class="key-item"><i data-kind="pm"></i>продукт</span><span class="key-item"><i data-kind="study"></i>учёба</span><span class="key-item"><i data-kind="note"></i>заметки</span><span class="key-item"><i data-kind="link"></i>ссылки</span></p>
  </aside>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
  <script type="module" src="./js/main.js?v=71"></script>
</body>
</html>

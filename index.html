<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Илья Гончаров</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #241f1a; cursor: none; }
    body {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: #f3ecdf;
      overflow: hidden;
    }
    #view { display: block; width: 100%; height: 100%; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .label {
      position: absolute;
      left: 0;
      top: 0;
      width: 260px;
      padding: 8px 10px 10px;
      background: rgba(28, 24, 20, 0.92);
      border: 1px solid rgba(243, 236, 223, 0.22);
      border-radius: 4px;
      pointer-events: auto;
      transform: translate(-50%, calc(-100% - 16px));
    }
    .label b { display: block; font-weight: 500; font-size: 13px; }
    .label p { margin: 6px 0 8px; min-height: 2.8em; color: #cbbfae; font-size: 12px; line-height: 1.4; }
    .label a { color: #f3ecdf; cursor: pointer; }
    .label a[hidden] { display: none; }
    .caret {
      display: inline-block;
      width: 0.5em;
      height: 0.95em;
      margin-left: 1px;
      background: #cbbfae;
      vertical-align: text-bottom;
    }
    .caret[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="labels"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
  <script type="module" src="./js/main.js?v=6"></script>
</body>
</html>

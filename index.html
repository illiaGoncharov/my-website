<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Илья Гончаров</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #241f1a; cursor: none; touch-action: none; }
    body {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: #f3ecdf;
      overflow: hidden;
    }
    #view { display: block; width: 100%; height: 100%; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .label {
      position: absolute;
      left: 0;
      top: 0;
      width: 340px;
      max-height: min(78vh, 540px);
      overflow: auto;
      padding: 8px 10px 10px;
      background: rgba(28, 24, 20, 0.92);
      border: 1px solid rgba(243, 236, 223, 0.22);
      border-radius: 4px;
      pointer-events: auto;
      touch-action: pan-y;
      transform: translate(-50%, calc(-100% - 16px));
    }
    .label b { display: block; font-weight: 500; font-size: 13px; }
    .label .role { display: block; margin-top: 2px; color: #cbbfae; font-size: 11px; font-style: normal; }
    .label .role[hidden] { display: none; }
    .label .who { display: block; margin-top: 8px; color: rgba(243, 236, 223, 0.45); font-size: 10px; letter-spacing: 0.04em; }
    .label p { margin: 2px 0 0; color: #cbbfae; font-size: 12px; line-height: 1.4; }
    .label section[hidden] { display: none; }
    .label a { color: #f3ecdf; cursor: pointer; }
    .label a[hidden] { display: none; }
    .caret {
      display: inline-block;
      width: 0.5em;
      height: 0.95em;
      margin-left: 1px;
      background: #cbbfae;
      vertical-align: text-bottom;
    }
    .caret[hidden] { display: none; }
    #name {
      position: fixed;
      top: 16px;
      left: 18px;
      margin: 0;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.5);
      pointer-events: none;
    }
    #hint {
      position: fixed;
      left: 18px;
      bottom: 16px;
      max-width: min(560px, calc(100vw - 36px));
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.5);
      pointer-events: none;
    }
    #hint p { margin: 0; }
    #sound {
      pointer-events: auto;
      cursor: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.82);
    }
    #sound[aria-pressed="false"] { color: rgba(243, 236, 223, 0.28); }
    #hint .key { margin-top: 3px; }
    #hint i {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 5px 1px 0;
      border-radius: 50%;
      vertical-align: middle;
    }
    #rhythm {
      position: fixed;
      right: 18px;
      bottom: 16px;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 10px;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.5);
      text-align: right;
    }
    #rhythm p { margin: 0; }
    #rhythm div { margin: 0; }
    #sound + div { margin-left: 14px; }
    #rhythm div button + button { margin-left: 10px; }
    #rhythm button {
      cursor: none;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(243, 236, 223, 0.34);
    }
    #rhythm button[aria-pressed="true"] { color: rgba(243, 236, 223, 0.82); }
    @media (min-width: 721px) {
      #hint .lead {
        position: fixed;
        top: 16px;
        right: 18px;
        left: auto;
        bottom: auto;
        max-width: min(360px, calc(100vw - 36px));
        text-align: right;
      }
    }
    @media (max-width: 720px) {
      #hint .lead { display: none; }
      #hint, #rhythm {
        left: 14px;
        right: 14px;
        max-width: none;
      }
      #hint { bottom: calc(10px + env(safe-area-inset-bottom)); }
      #hint .key { margin-top: 0; }
      #rhythm {
        bottom: calc(26px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: flex-start;
        align-items: baseline;
        gap: 10px;
        text-align: left;
      }
      #sound { width: auto; text-align: left; padding: 8px 0; }
      #rhythm div { margin-top: 0; }
      #rhythm button { padding: 8px 0; }
    }
  </style>
</head>
<body>
  <p id="name">elia goncharov</p>
  <canvas id="view"></canvas>
  <div id="labels"></div>
  <aside id="hint">
    <p class="lead">наведите курсор на куб, чтобы открыть карточку</p>
    <p class="key"><i data-kind="dev"></i>разработка, <i data-kind="pm"></i>продукт, <i data-kind="study"></i>учёба, <i data-kind="note"></i>заметки, <i data-kind="link"></i>ссылки</p>
  </aside>
  <aside id="rhythm">
    <button id="sound" type="button" aria-pressed="false">звук вкл</button>
    <div>
      <button type="button" data-rhythm="pulse">удар</button>
      <button type="button" data-rhythm="torn">рваный</button>
      <button type="button" data-rhythm="drops">ноты</button>
    </div>
  </aside>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
  <script type="module" src="./js/main.js?v=41"></script>
</body>
</html>
